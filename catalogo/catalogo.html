    <!-- SECCIÓN 3: ÁREA PRINCIPAL (CATALOGO) -->

     <section class="contenido-principal flex-grow-1 p-4">
            <div class="row g-4 justify-content-start">

                    <div class="col-12 col-xl-8">
                        <div class="card-inventario">
                            
    <!-- SECCION 4: INTERFAZ DE BUSCAR CATÁLOGO EN LA TABLA -->

                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                                <h5>Catálogo de Ejemplares</h5>
                    
                            <div class="d-flex gap-2">

                                <select id="filtroCategoria" class="form-select w-auto" aria-label="Filtro de catágorias">
                                    <option value="Todas" selected>Todas las categorías</option>
                                    <option value="Novela">Novela</option>
                                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                                    <option value="Fantasía">Fantasía</option>
                                    <option value="Historia">Historia</option>
                                    <option value="Tecnología">Tecnología</option>
                                    <option value="Educación">Educación</option>
                                </select>

                                <input type="text" id="buscadorTabla" class="form-control w-auto" style="min-width: 260px;" placeholder="Buscar por título o autor...">
                            </div>
                        </div>

     <!-- SECCION 5: CREACIÓN DE LAS VARIABLES DE LA TABLA PARA LOS RESPECTIVOS LIBROS -->

                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-header-miralib">

                                        <tr>
                                            <th>#</th>
                                            <th>Título</th>
                                            <th>Autor</th>
                                            <th>Categoría</th>
                                            <th>Stock</th>
                                            <th>Estado</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>

                                    </thead>
                                    <tbody id="tablaCuerpo" class="tabla-automatica">
                                    </tbody>
                                </table>
                            </div>
                        </div>
