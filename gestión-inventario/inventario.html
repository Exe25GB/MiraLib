<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica JavaScript</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
         <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="../_multimedia/ceo.css">
       

    </head>

    <body>

        <header>
            <img src="../_multimedia/img/MiraLib-logo.png" alt="Error Logo" class="logo-principal">
            <h1 id="titulo-principal">MiraLib</h1>
            <span class="separador">|</span>
            <p id="subtitulo"> 🕮 Una página para compartir libros. </p>
        </header>

        <main>

            <!-- SECCIÓN 2: MENU LATERAL -->
            <aside class = "menu-lateral">
                <p class = "titulo-navegacion">NAVEGACIÓN</p>
        
                <nav>
                    <ul class="v-lista-menu">
                    
                        <!-- CATÁLOGO -->
                        <li class="v-boton-catálogo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-book-half" viewBox="0 0 16 16">
                            <path d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>
                            </svg>
                            <a href="#">Catálogo</a>
                        </li>

                        <!-- SOLICITUD -->
                        <li class="v-boton-solicitud">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar-plus" viewBox="0 0 16 16">
                            <path d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7"/>
                            <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
                            </svg>
                            <a href="#">Solicitud</a>
                        </li>

                    <!-- INVENTARIO -->
                        <li class="v-boton-inventario">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-database" viewBox="0 0 16 16">
                            <path d="M4.318 2.687C5.234 2.271 6.536 2 8 2s2.766.27 3.682.687C12.644 3.125 13 3.627 13 4c0 .374-.356.875-1.318 1.313C10.766 5.729 9.464 6 8 6s-2.766-.27-3.682-.687C3.356 4.875 3 4.373 3 4c0-.374.356-.875 1.318-1.313M13 5.698V7c0 .374-.356.875-1.318 1.313C10.766 8.729 9.464 9 8 9s-2.766-.27-3.682-.687C3.356 7.875 3 7.373 3 7V5.698c.271.202.58.378.904.525C4.978 6.711 6.427 7 8 7s3.022-.289 4.096-.777A5 5 0 0 0 13 5.698M14 4c0-1.007-.875-1.755-1.904-2.223C11.022 1.289 9.573 1 8 1s-3.022.289-4.096.777C2.875 2.245 2 2.993 2 4v9c0 1.007.875 1.755 1.904 2.223C4.978 15.71 6.427 16 8 16s3.022-.289 4.096-.777C13.125 14.755 14 14.007 14 13zm-1 4.698V10c0 .374-.356.875-1.318 1.313C10.766 11.729 9.464 12 8 12s-2.766-.27-3.682-.687C3.356 10.875 3 10.373 3 10V8.698c.271.202.58.378.904.525C4.978 9.71 6.427 10 8 10s3.022-.289 4.096-.777A5 5 0 0 0 13 8.698m0 3V13c0 .374-.356.875-1.318 1.313C10.766 14.729 9.464 15 8 15s-2.766-.27-3.682-.687C3.356 13.875 3 13.373 3 13v-1.302c.271.202.58.378.904.525C4.978 12.71 6.427 13 8 13s3.022-.289 4.096-.777c.324-.147.633-.323.904-.525"/>
                            </svg>
                            <a href="#">Inventario</a>
                        </li>
                    
                    </ul>
                </nav>
            </aside>

            <!-- ÁREA DE GESTIÓN R.5 -->
            <section class="contenido-principal flex-grow-1 p-4">
                <div class="row g-4">
                    
                    <!-- Formulario Registrar / Editar -->
                    <div class="col-12 col-xl-4">
                        <div class="card-inventario">
                            <h5 id="formTitulo" class="mb-3">Registrar Nuevo Ejemplar</h5>
                            
                            <form id="formLibro">
                                <input type="hidden" id="libroId">

                                <div class="mb-3">
                                    <label for="tituloLibro" class="form-label">Título</label>
                                    <input type="text" class="form-control" id="tituloLibro" placeholder="Ej: Cien años de soledad" required>
                                </div>

                                <div class="mb-3">
                                    <label for="autorLibro" class="form-label">Autor</label>
                                    <input type="text" class="form-control" id="autorLibro" placeholder="Ej: Gabriel García Márquez" required>
                                </div>

                                <div class="mb-3">
                                    <label for="categoriaLibro" class="form-label">Categoría</label>
                                    <select id="categoriaLibro" class="form-select" required>
                                        <option value="" selected disabled>Seleccione categoría...</option>
                                        <option value="Novela">Novela</option>
                                        <option value="Ciencia Ficción">Ciencia Ficción</option>
                                        <option value="Fantasía">Fantasía</option>
                                        <option value="Historia">Historia</option>
                                        <option value="Tecnología">Tecnología</option>
                                        <option value="Educación">Educación</option>
                                    </select>
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <label for="stockLibro" class="form-label">Ejemplares</label>
                                        <input type="number" class="form-control" id="stockLibro" min="0" placeholder="Cantidad" required>
                                    </div>
                                    <div class="col-6">
                                        <label for="estadoLibro" class="form-label">Estado</label>
                                        <select id="estadoLibro" class="form-select" required>
                                            <option value="Disponible">Disponible</option>
                                            <option value="En Préstamo">En Préstamo</option>
                                            <option value="De Baja">De Baja</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button class="btn btn-miralib" type="submit" id="btnGuardar">Guardar Ejemplar</button>
                                    <button class="btn btn-secondary d-none" type="button" id="btnCancelarEdicion">Cancelar Edición</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Tabla del Catálogo de Libros -->
                    <div class="col-12 col-xl-8">
                        <div class="card-inventario">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                                <h5>Catálogo de Ejemplares</h5>
                                <input type="text" id="buscadorTabla" class="form-control w-auto" style="min-width: 260px;" placeholder="Buscar por título o autor...">
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-header-miralib">
                                        <tr>
                                            <th>#</th>
                                            <th>Título</th>
                                            <th>Autor</th>
                                            <th>Categoría</th>
                                            <th>Stock</th>
                                            <th>Estado</th>
                                            <th class="text-center">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaCuerpo" class="tabla-automatica">
                                        <!-- Contenido inyectado por JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <script src="script-inventario.js"></script>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
