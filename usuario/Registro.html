<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica JavaScript</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="../_multimedia/ceo.css">

    </head>

    <body>

        <header>
            <img src="../_multimedia/img/MiraLib-logo.png" alt="Error Logo" class="logo-principal">
            <h1 id="titulo-principal">MiraLib</h1>
            <span class="separador">|</span>
            <p id="subtitulo"> 🕮 Una página para vender y compartir libros. </p>
        </header>

        <main>
            <div class="contenedor2">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="inputEmail4" class="form-label">Email</label>
                        <input type="email" class="form-control" id="v_email">
                    </div>
                    <div class="col-md-6">
                        <label for="inputPassword4" class="form-label">Password</label>
                        <input type="password" class="form-control" id="v_password">
                    </div>
                    <div class="col-md-6">
                        <label for="inputAddress" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="v_nombre">
                    </div>
                    <div class="col-md-6">
                        <label for="inputState" class="form-label">Sexo</label>
                        <select id="v_sexo" class="form-select">
                        <option selected>Sexo</option>
                        <option>Hombre</option>
                        <option>Mujer</option>
                        <option>Transgenero</option>
                        <option>No Definido</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="v_terminos">
                        <label class="form-check-label" for="gridCheck">
                            Acepto los términos y condiciones
                        </label>
                        </div>
                    </div>

                    <div class="d-grid gap-2 col-6 mx-auto mt-3">
                        <button class="btn btn-primary" type="button" id="Enter2">Registrar</button>
                        <button class="btn btn-primary" type="button" id="Volver">Volver</button>
                    </div>
                </form>
            </div>
        </main>

        <script src="script-registro.js"></script>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
